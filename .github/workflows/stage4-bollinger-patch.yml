name: Stage4 Bollinger Chart Patch

on:
  push:
    branches:
      - chart-stage4-bollinger-squeeze
    paths:
      - scripts/apply-bollinger-stage4.mjs
      - .github/workflows/stage4-bollinger-patch.yml

permissions:
  contents: write

jobs:
  patch-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chart-stage4-bollinger-squeeze
          fetch-depth: 0

      - name: Apply guarded Bollinger patch
        run: node scripts/apply-bollinger-stage4.mjs

      - name: Commit patched chart
        run: |
          if git diff --quiet -- src/components/trading/RealTimeTradingViewChart.tsx; then
            echo "No chart changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/trading/RealTimeTradingViewChart.tsx
          git commit -m "feat(chart): render Bollinger bands squeeze and breakout status"
          git push origin HEAD:chart-stage4-bollinger-squeeze

name: Stage5 Volume Profile Chart Patch

on:
  push:
    branches:
      - chart-stage5-volume-profile
    paths:
      - scripts/apply-volume-profile-stage5.mjs
      - .github/workflows/stage5-volume-profile-patch.yml

permissions:
  contents: write

jobs:
  patch-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chart-stage5-volume-profile
          fetch-depth: 0

      - name: Apply guarded volume profile patch
        run: node scripts/apply-volume-profile-stage5.mjs

      - name: Commit patched chart
        run: |
          if git diff --quiet -- src/components/trading/RealTimeTradingViewChart.tsx; then
            echo "No chart changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/trading/RealTimeTradingViewChart.tsx
          git commit -m "feat(chart): render POC VAH VAL and live volume profile"
          git push origin HEAD:chart-stage5-volume-profile

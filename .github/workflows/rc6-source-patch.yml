name: RC6 One-Shot Server Source Patch

on:
  push:
    branches:
      - fix/rc6-production-hardening
    paths:
      - scripts/rc6-patch-server-source.mjs
      - .github/workflows/rc6-source-patch.yml

permissions:
  contents: write

jobs:
  patch-server-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/rc6-production-hardening
          fetch-depth: 0

      - name: Apply deterministic RC6 source patch
        run: node scripts/rc6-patch-server-source.mjs

      - name: Commit patched server.ts if changed
        shell: bash
        run: |
          if git diff --quiet -- server.ts; then
            echo "server.ts already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(server): remove simulated execution and synthetic fallbacks"
          git push origin HEAD:fix/rc6-production-hardening

name: AISTOCK CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Strict Lockfile Check)
        run: npm ci

      - name: Run Type Check / Linter
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Run Production Build
        run: npm run build

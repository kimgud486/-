name: AISTOCK v13.1 Validation & Safety CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-safety-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check & Lint
        run: npm run lint

      - name: Run AISTOCK v13.1 Safety Test Suite
        run: node --import tsx --test tests/v13_1/validation-safety.test.ts

      - name: Verify Production Build
        run: npm run build

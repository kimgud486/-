    <script>
      (function() {
        if (typeof window !== 'undefined' && window.performance) {
          try {
            var origM = window.performance.measure;
            if (typeof origM === 'function') {
              window.performance.measure = function() {
                try {
                  return origM.apply(window.performance, arguments);
                } catch(e) {
                  try {
                    if (window.performance.clearMarks) window.performance.clearMarks();
                    if (window.performance.clearMeasures) window.performance.clearMeasures();
                  } catch(_) {}
                  return undefined;
                }
              };
            }
            var origMark = window.performance.mark;
            if (typeof origMark === 'function') {
              window.performance.mark = function() {
                try {
                  return origMark.apply(window.performance, arguments);
                } catch(e) {
                  return undefined;
                }
              };
            }
          } catch(e) {}
        }
      })();
    </script>

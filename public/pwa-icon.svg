<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- J.A.R.V.I.S. AI Core Pulse Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="3" />
  
  <!-- Stock Trend Line & Glow -->
  <path d="M 120 340 L 190 280 L 250 310 L 330 180 L 390 150" fill="none" stroke="url(#line-grad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- AI Pulse Nodes -->
  <circle cx="120" cy="340" r="10" fill="#06b6d4" />
  <circle cx="190" cy="280" r="10" fill="#06b6d4" />
  <circle cx="250" cy="310" r="10" fill="#06b6d4" />
  <circle cx="330" cy="180" r="12" fill="#38bdf8" />
  <circle cx="390" cy="150" r="16" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  
  <!-- AI Text Branding -->
  <text x="256" y="420" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="4">AISTOCK</text>
  <text x="256" y="455" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="6">JARVIS 24</text>
</svg>
